
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5 Candle Pattern Scanner</title>
<style>
body {
  background:#101827;
  color:white;
  font-family:Arial,sans-serif;
  padding:15px;
  margin:0;
}
.container {
  max-width:600px;
  margin:auto;
}
h2 {text-align:center;color:#60a5fa;}
.note {color:#cbd5e1;text-align:center;font-size:13px;}
table {
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td {
  border:1px solid #475569;
  padding:7px 3px;
  text-align:center;
}
th {background:#263449;}
input {
  width:90%;
  box-sizing:border-box;
  padding:9px 2px;
  text-align:center;
  background:#263449;
  color:white;
  border:1px solid #64748b;
  border-radius:5px;
}
button {
  padding:12px 8px;
  border:0;
  border-radius:7px;
  color:white;
  font-weight:bold;
  margin:5px 1%;
  width:47%;
  cursor:pointer;
}
.buy {background:#15803d;}
.sell {background:#dc2626;}
.sample {background:#475569;}
.auto {background:#2563eb;width:98%;}
#result {
  margin-top:18px;
  padding:15px;
  text-align:center;
  background:#263449;
  border-radius:8px;
  font-weight:bold;
}
</style>
</head>
<body>
<div class="container">
<h2>5 Candle Pattern Scanner</h2>
<p class="note">Educational Demo Testing Only</p>

<table>
<thead>
<tr>
<th>Candle</th>
<th>Open</th>
<th>High</th>
<th>Low</th>
<th>Close</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>

<button class="sample" onclick="loadSample('SELL')">LOAD SELL SAMPLE</button>
<button class="sample" onclick="loadSample('BUY')">LOAD BUY SAMPLE</button>

<button class="sell" onclick="test('SELL')">TEST SELL PATTERN</button>
<button class="buy" onclick="test('BUY')">TEST BUY PATTERN</button>

<button class="auto" onclick="autoTest()">AUTO DETECT BOTH</button>

<div id="result">Enter 5 Candle Values</div>
</div>

<script>
const sellData=[
[10,12,9,11],
[11,13,10,12],
[12,14,11,13],
[13,14,11,12],
[12,13,10,11]
];

const buyData=[
[13,14,11,12],
[12,13,10,11],
[11,12,9,10],
[10,13,9,12],
[12,14,10,13]
];

const rows=document.getElementById("rows");

for(let i=0;i<5;i++){
let tr=document.createElement("tr");
tr.innerHTML=`<td>${i+1}</td>`+
[0,1,2,3].map(j=>
`<td><input type="number" step="any" id="c${i}_${j}"></td>`
).join("");
rows.appendChild(tr);
}

function show(msg){
document.getElementById("result").innerHTML=msg;
}

function loadSample(type){
const data=type==="SELL"?sellData:buyData;
data.forEach((c,i)=>c.forEach((v,j)=>{
document.getElementById(`c${i}_${j}`).value=v;
}));
show(type+" sample loaded. Now test.");
}

function getCandles(){
const candles=[];
for(let i=0;i<5;i++){
let v=[0,1,2,3].map(j=>
document.getElementById(`c${i}_${j}`).value.trim()
);
if(v.some(x=>x==="")){
show("Please fill all 5 candle values.");
return null;
}
let [o,h,l,c]=v.map(Number);
if(![o,h,l,c].every(Number.isFinite)||
h<Math.max(o,c)||l>Math.min(o,c)||h<l){
show("Invalid values in Candle "+(i+1));
return null;
}
candles.push({o,h,l,c});
}
return candles;
}

function detect(candles,type){
if(type==="SELL"){
return candles.slice(0,3).every(x=>x.c>x.o)&&
candles[3].c<candles[3].o&&
candles[4].c<candles[4].o&&
candles[4].l<candles[3].l;
}
return candles.slice(0,3).every(x=>x.c<x.o)&&
candles[3].c>candles[3].o&&
candles[4].c>candles[4].o&&
candles[4].h>candles[3].h;
}

function test(type){
const candles=getCandles();
if(!candles)return;
let valid=detect(candles,type);
show(valid?
"SUCCESS!<br>"+type+" Pattern Detected<br>Demo Test Passed":
"Pattern Not Detected");
}

function autoTest(){
const candles=getCandles();
if(!candles)return;
let buy=detect(candles,"BUY");
let sell=detect(candles,"SELL");
show("AUTO DETECTION RESULT<br><br>"+
"BUY: "+(buy?"DETECTED":"NOT DETECTED")+
"<br>SELL: "+(sell?"DETECTED":"NOT DETECTED"));
}

loadSample("SELL");
</script>
</body>
</html>
